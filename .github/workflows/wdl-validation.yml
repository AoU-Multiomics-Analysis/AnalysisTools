name: WDL validation
on:
  pull_request:
    paths: ['workflows/**', 'scripts/**', 'tests/**', '.github/workflows/wdl-validation.yml']
  push:
    paths: ['workflows/**', 'scripts/**', 'tests/**', '.github/workflows/wdl-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install miniwdl==1.14.2
      - run: miniwdl check workflows/pair_ld.wdl
      - run: python tests/check_wdl.py
      - name: Check input errors
        run: |
          cd tests
          python -m unittest -v \
            test_pair_ld.PairLDTest.test_cloud_uri_is_a_localization_error \
            test_pair_ld.PairLDTest.test_population_table_must_cover_the_cohort
